# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - og-track-backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          AZURE_SQL_SERVER: ci-dummy.database.windows.net
          AZURE_SQL_USER: ci-dummy
          AZURE_SQL_PASSWORD: ci-dummy-password-not-real
          JWT_SECRET: ci-dummy-jwt-secret-not-real
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'og-track-backend'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0C1D2C90133E42048ECE8F47A0F7A4FF }}

      # AIDA roadmap item 4a — a WhatsApp ping once the deploy above actually
      # succeeds. Best-effort (|| true): a failed notification should never
      # fail the deploy itself, same reasoning as every other proactive
      # notification in this codebase being swallow-and-log rather than
      # fatal. Needs DEPLOY_NOTIFY_SECRET set as a GitHub Actions secret,
      # matching the same value as the server's own env var.
      - name: 'Notify WhatsApp of successful deploy'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SUMMARY_JSON=$(echo "$COMMIT_MESSAGE" | head -c 200 | jq -Rs .)
          curl -s -X POST "https://og-track-backend.azurewebsites.net/api/masteradmin/deploy-notify" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_NOTIFY_SECRET }}" \
            -d "{\"version\": \"$SHORT_SHA\", \"summary\": $SUMMARY_JSON}" \
            || true